[build-system]
requires = ["setuptools>=61.0", "torch>=2.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deltanet_v2"
version = "2.0.0"
description = "High-Performance DeltaNet v2 Linear Attention CUDA Kernels & PyTorch Module"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "CBG6682"}
]
keywords = ["linear-attention", "cuda", "cutlass", "cute", "deltanet", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Programming Language :: CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/CBG6682/Deltanet"
Repository = "https://github.com/CBG6682/Deltanet.git"
